# HAND-CURATED. See CLAUDE.md — INSPIRE never generates or expands this list.
# Lines marked VERIFY carry an inference from CV.tex that the author must confirm.
#
# `date` is the arXiv / first-public date, NOT the journal publication date. It exists to
# sort the rendered output and is otherwise not displayed; `ref` carries the journal year.
# Using the first-public date keeps ordering stable — a preprint that gets published during
# proofs updates `ref` via `inspire.py check` without resorting the CV. Entries are kept in
# descending `date` order within each domain block as a courtesy; the renderer sorts anyway.
#
# There is no `contribution` and no `role` field. Presence in this file IS the claim of
# relevance — the list is curated, so everything here is selected. Expertise is evidenced
# elsewhere on the CV (research highlights, talks, service), not annotated per paper.

