name: Deploy site

# Builds the Jekyll/al-folio site and publishes it with the official GitHub Pages actions.
# Requires: repo Settings → Pages → Source = "GitHub Actions".
# Pull requests only build (to catch breakage); only pushes to master deploy.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Install ImageMagick (responsive images)
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
